[package]
name        = "qjs"
version     = "0.1.0"
description = "Run a JavaScript file (a script, or an ES module with its imports from files) through import mcpplibs.mwrap.quickjs_ng; the host upstream's own tests run on"
license     = "Apache-2.0"

[targets.qjs]
kind = "bin"
main = "src/main.cpp"

[dependencies]
"mcpplibs.mwrap.quickjs_ng" = { path = "../.." }

# An 8 MB stack on Windows, as upstream links its programs: the default 1 MB
# is QuickJS's own JS stack limit, so deep recursion would overflow the C
# stack before the engine's RangeError (CMakeLists.txt, "Set a 8MB default
# stack size on Windows").
[target.'cfg(all(os = "windows", env = "msvc"))'.build]
ldflags = ["-Wl,/STACK:8388608"]

[target.'cfg(all(os = "windows", env = "gnu"))'.build]
ldflags = ["-Wl,--stack,8388608"]
